[project]
name = "ssa-alj-mcp-eval-sdk"
version = "0.1.0"
description = "mcpevals agent suite against the SSA ALJ MCP server (stdio)"
requires-python = ">=3.11"
dependencies = [
    # mcp-agent (via mcpevals) still imports mcp.server.fastmcp — requires MCP SDK 1.x.
    # The server under test is spawned separately via `uv run --project <repo> ssa-alj-mcp`
    # and keeps FastMCP 4 / mcp 2.x in the main project venv.
    "mcpevals>=0.1.10",
    "mcp>=1.28.0,<2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "mcp_eval: agent eval that needs ANTHROPIC_API_KEY or OPENAI_API_KEY",
]
