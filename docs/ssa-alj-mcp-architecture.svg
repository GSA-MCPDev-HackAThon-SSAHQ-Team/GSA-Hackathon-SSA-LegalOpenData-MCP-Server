<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SSA ALJ MCP Server architecture</title>
  <desc id="desc">MCP hosts and clients talk MCP/JSON-RPC 2.0 to the SSA ALJ MCP Server, which exposes tools, resources, and prompts over a read-only SQLite dispositions database.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Left group -->
  <rect x="48" y="72" width="300" height="576" rx="18" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="118" y="52" width="160" height="32" rx="16" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <text x="198" y="73" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">MCP hosts &amp; clients</text>

  <!-- Right group -->
  <rect x="932" y="72" width="300" height="576" rx="18" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="982" y="52" width="200" height="32" rx="16" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <text x="1082" y="73" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#374151">Server internals &amp; data</text>

  <!-- Left boxes -->
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="78" y="118" width="240" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="198" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">Claude Desktop</text>
    <text x="198" y="174" text-anchor="middle" font-size="12" fill="#64748b">MCP host · Connectors</text>

    <rect x="78" y="232" width="240" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="198" y="264" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">Cursor</text>
    <text x="198" y="288" text-anchor="middle" font-size="12" fill="#64748b">MCP host · remote /mcp</text>

    <rect x="78" y="346" width="240" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="198" y="378" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">ChatGPT / MCPJam</text>
    <text x="198" y="402" text-anchor="middle" font-size="12" fill="#64748b">remote MCP client</text>

    <rect x="78" y="460" width="240" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="198" y="492" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">Goose / Claude Code</text>
    <text x="198" y="516" text-anchor="middle" font-size="12" fill="#64748b">local stdio client</text>
  </g>

  <!-- Center URLs + server box -->
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="448" y="198" width="384" height="72" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="640" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9" letter-spacing="0.04em">SERVER URLS</text>
    <text x="640" y="242" text-anchor="middle" font-size="11" fill="#4c1d95">
      <tspan font-weight="600">Remote</tspan>
      <tspan fill="#6b7280">  https://www.ssa-alj-mcpserver-gsahackathon.online/mcp</tspan>
    </text>
    <text x="640" y="260" text-anchor="middle" font-size="11" fill="#4c1d95">
      <tspan font-weight="600">Local</tspan>
      <tspan fill="#6b7280">  http://127.0.0.1:8000/mcp</tspan>
    </text>
  </g>
  <rect x="500" y="278" width="280" height="196" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="640" y="308" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#4c1d95">SSA ALJ MCP Server</text>
  <text x="640" y="328" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">FastMCP · route, guard, query</text>
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="520" y="344" width="240" height="36" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="640" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" letter-spacing="0.04em">TOOLS</text>
    <rect x="520" y="388" width="240" height="36" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="640" y="411" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" letter-spacing="0.04em">RESOURCES</text>
    <rect x="520" y="432" width="240" height="36" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="640" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" letter-spacing="0.03em">SKILLS / PROMPTS</text>
  </g>

  <!-- Right boxes -->
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="962" y="118" width="240" height="78" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="1082" y="150" text-anchor="middle" font-size="18" font-weight="600" fill="#991b1b">Tools (15)</text>
    <text x="1082" y="174" text-anchor="middle" font-size="12" fill="#64748b">judge · office · trend queries</text>

    <rect x="962" y="232" width="240" height="78" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="1082" y="264" text-anchor="middle" font-size="18" font-weight="600" fill="#991b1b">Resources &amp; Prompts</text>
    <text x="1082" y="288" text-anchor="middle" font-size="12" fill="#64748b">ssa-alj://about · analysis</text>

    <rect x="962" y="346" width="240" height="78" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="1082" y="378" text-anchor="middle" font-size="18" font-weight="600" fill="#991b1b">Services → db.py</text>
    <text x="1082" y="402" text-anchor="middle" font-size="12" fill="#64748b">parameterised SQL</text>

    <rect x="962" y="460" width="240" height="78" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="1082" y="492" text-anchor="middle" font-size="18" font-weight="600" fill="#991b1b">SQLite (read-only)</text>
    <text x="1082" y="516" text-anchor="middle" font-size="12" fill="#64748b">dispositions FY2010–2026</text>
  </g>

  <!-- Left connectors -->
  <g fill="none" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 157 H420 V330 H500" marker-end="url(#arrowBlue)"/>
    <path d="M318 271 H400 V340 H500" marker-end="url(#arrowBlue)"/>
    <path d="M318 385 H400 V370 H500" marker-end="url(#arrowBlue)"/>
    <path d="M318 499 H420 V390 H500" marker-end="url(#arrowBlue)"/>
  </g>
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb">
    <text x="340" y="148">MCP / JSON-RPC 2.0</text>
    <text x="340" y="166" fill="#64748b">Streamable HTTP /mcp</text>
    <text x="328" y="262">MCP / JSON-RPC 2.0</text>
    <text x="328" y="376">MCP / JSON-RPC 2.0</text>
    <text x="340" y="490">MCP / JSON-RPC 2.0</text>
    <text x="340" y="508" fill="#64748b">stdio</text>
  </g>

  <!-- Right connectors -->
  <g fill="none" stroke="#7c3aed" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M780 330 H860 V157 H962" marker-end="url(#arrowPurple)"/>
    <path d="M780 350 H880 V271 H962" marker-end="url(#arrowPurple)"/>
    <path d="M780 370 H880 V385 H962" marker-end="url(#arrowPurple)"/>
    <path d="M780 390 H860 V499 H962" marker-end="url(#arrowPurple)"/>
  </g>
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#6d28d9">
    <text x="800" y="148">tools/call</text>
    <text x="800" y="262">resources/read</text>
    <text x="800" y="376">in-process</text>
    <text x="800" y="490">SQL (mode=ro)</text>
  </g>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
