<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MCP host, client, and server roles</title>
  <desc id="desc">Three MCP building blocks: the host application embeds an MCP client that speaks MCP/JSON-RPC to the MCP server.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="72" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">MCP building blocks</text>
  <text x="640" y="108" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="15" fill="#6b7280">Host embeds Client · Client speaks MCP to Server</text>

  <!-- MCP Host -->
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="72" y="200" width="300" height="320" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="132" y="176" width="180" height="36" rx="18" fill="#3b82f6"/>
    <text x="222" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MCP Host</text>
    <text x="222" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">App / IDE</text>
    <text x="222" y="300" text-anchor="middle" font-size="14" fill="#475569">Claude Desktop</text>
    <text x="222" y="324" text-anchor="middle" font-size="14" fill="#475569">Cursor · ChatGPT</text>
    <text x="222" y="348" text-anchor="middle" font-size="14" fill="#475569">Goose · MCPJam</text>
    <text x="222" y="400" text-anchor="middle" font-size="13" fill="#64748b">Owns the user session</text>
    <text x="222" y="424" text-anchor="middle" font-size="13" fill="#64748b">and embeds the client</text>
  </g>

  <!-- Arrow 1 -->
  <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)">
    <path d="M388 360 H468"/>
  </g>
  <text x="428" y="340" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">embeds</text>

  <!-- MCP Client -->
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="484" y="200" width="300" height="320" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="544" y="176" width="180" height="36" rx="18" fill="#7c3aed"/>
    <text x="634" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MCP Client</text>
    <text x="634" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">Protocol client</text>
    <text x="634" y="300" text-anchor="middle" font-size="14" fill="#475569">Connectors / SDK</text>
    <text x="634" y="324" text-anchor="middle" font-size="14" fill="#475569">tools/list · tools/call</text>
    <text x="634" y="348" text-anchor="middle" font-size="14" fill="#475569">resources · prompts</text>
    <text x="634" y="400" text-anchor="middle" font-size="13" fill="#64748b">Speaks MCP / JSON-RPC 2.0</text>
    <text x="634" y="424" text-anchor="middle" font-size="13" fill="#64748b">stdio or Streamable HTTP</text>
  </g>

  <!-- Arrow 2 -->
  <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)">
    <path d="M800 360 H880"/>
  </g>
  <text x="840" y="332" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">MCP</text>
  <text x="840" y="350" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">JSON-RPC 2.0</text>

  <!-- MCP Server -->
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif">
    <rect x="896" y="200" width="300" height="320" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="956" y="176" width="180" height="36" rx="18" fill="#ea580c"/>
    <text x="1046" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MCP Server</text>
    <text x="1046" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">SSA ALJ MCP</text>
    <text x="1046" y="268" text-anchor="middle" font-size="12" fill="#78716c">FastMCP · /mcp</text>

    <!-- Small boxes inside server: TOOLS / RESOURCES / SKILLS·PROMPTS -->
    <rect x="920" y="286" width="252" height="54" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <rect x="920" y="286" width="8" height="54" rx="4" fill="#f97316"/>
    <text x="1050" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412" letter-spacing="0.06em">TOOLS</text>
    <text x="1050" y="326" text-anchor="middle" font-size="11" fill="#57534e">15 read-only query tools</text>

    <rect x="920" y="350" width="252" height="54" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <rect x="920" y="350" width="8" height="54" rx="4" fill="#f97316"/>
    <text x="1050" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412" letter-spacing="0.06em">RESOURCES</text>
    <text x="1050" y="390" text-anchor="middle" font-size="11" fill="#57534e">ssa-alj://about</text>

    <rect x="920" y="414" width="252" height="54" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <rect x="920" y="414" width="8" height="54" rx="4" fill="#f97316"/>
    <text x="1050" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" letter-spacing="0.03em">SKILLS / PROMPTS</text>
    <text x="1050" y="454" text-anchor="middle" font-size="11" fill="#57534e">compare_office · judge_summary</text>

    <text x="1046" y="496" text-anchor="middle" font-size="12" fill="#78716c">Read-only SQLite · FY2010–2026</text>
  </g>

  <!-- Footer -->
  <text x="640" y="600" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">One host can embed many clients · one client can connect to many servers</text>
  <text x="640" y="628" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">This repo is the MCP Server on the right</text>

  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
